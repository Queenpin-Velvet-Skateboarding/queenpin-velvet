<script>
/* Nächste Session: immer der nächste Dienstag (am Dienstag bis 20 Uhr: heute).
   Einträge im Google Sheet (Blatt «Sessions», als CSV veröffentlicht) überschreiben Ort/Zeit/Adresse/Special für dieses Datum. */
var SHEET_CSV='https://docs.google.com/spreadsheets/d/1kYG4ogNdltVRIJexxZI1mbG_KoOXpFpBImUoy6ZhLSc/gviz/tq?tqx=out:csv&sheet=Sessions';
var STANDARD={ort:'Freestyle Halle Zürich',zeit:'18.30–20.00',strasse:'Bändlistrasse 76',plz:'8064 Zürich',special:''};
(function(){
  function nextTuesday(){
    var d=new Date(),day=d.getDay(),add=(2-day+7)%7;
    if(add===0&&d.getHours()>=20)add=7;
    d.setDate(d.getDate()+add);d.setHours(0,0,0,0);return d;
  }
  function fmt(d){return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear();}
  function show(o){
    document.querySelectorAll('[data-f]').forEach(function(el){
      var k=el.getAttribute('data-f'),v=o[k]||'';
      if(k==='datum'&&v)v='Dienstag '+v;
      if(k==='zeit'&&v)v=v.replace(/\s*[–-]\s*/,' – ');
      if(k==='adresse')v=(o.ort&&o.ort!==STANDARD.ort&&o.strasse)?o.strasse+'\n'+(o.plz||''):'';
      if(k==='special'&&v)v=v.split(/\s*·\s*/).join('\n');
      el.textContent=v; if(k==='special'||k==='adresse')el.hidden=!v;
    });
  }
  var day=nextTuesday(),info=Object.assign({datum:fmt(day)},STANDARD);
  show(info);
  if(!SHEET_CSV)return;
  function parse(t){
    var rows=[],row=[],f='',q=false;
    for(var i=0;i<t.length;i++){var c=t[i];
      if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++;}else q=false;}else f+=c;}
      else if(c=='"')q=true; else if(c==','){row.push(f);f='';}
      else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);rows.push(row);row=[];f='';}
      else f+=c;}
    if(f||row.length){row.push(f);rows.push(row);}
    return rows;
  }
  fetch(SHEET_CSV,{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){
    var rows=parse(t),head=rows.shift().map(function(h){return h.trim().toLowerCase();});
    rows.forEach(function(r){
      var o={};head.forEach(function(h,i){o[h]=(r[i]||'').trim();});
      if(o.datum===info.datum){Object.keys(o).forEach(function(k){if(o[k]&&o[k].charAt(0)!=='#')info[k]=o[k];});}
    });
    show(info);
  }).catch(function(){});
})();
</script>
<script>
/* Fleck: in normaler Geschwindigkeit abspielen, sobald er sichtbar ist */
(function(){
  var v=document.querySelector('.s-video'),dot=document.querySelector('.s-dot');if(!v)return;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){v.classList.add('los');var i0=document.querySelector('.s-info');if(i0)i0.classList.add('da');v.addEventListener('loadeddata',function(){v.currentTime=v.duration-0.05;});return;}
  var bg=document.querySelector('.s-bg'),gestartet=false;
  function start(){if(gestartet)return;gestartet=true;
    v.classList.add('los');

    var info=document.querySelector('.s-info');
    function zeigen(){if(info)info.classList.add('da');}
    v.addEventListener('timeupdate',function(){if(v.currentTime>2.3)zeigen();});
    v.addEventListener('ended',zeigen);
    v.play().then(function(){if(dot)dot.style.opacity=0;}).catch(zeigen);}
  /* Hintergrund: Fleck der Startseite zieht sich zusammen und zerstäubt; danach landet der Tropfen */
  if(bg){
    bg.addEventListener('timeupdate',function(){if(bg.currentTime>7.9)start();});
    bg.addEventListener('ended',start);
    bg.addEventListener('error',start);
    bg.play().catch(function(){bg.classList.add('aus');start();});
    setTimeout(start,10000);
  }else start();
})();
</script>
