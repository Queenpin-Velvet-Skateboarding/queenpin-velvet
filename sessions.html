<script>
/* Nächste Session aus Google Sheet (CSV) laden. URL eintragen, sobald das Sheet veröffentlicht ist. */
var SHEET_CSV='';
(function(){
  if(!SHEET_CSV)return;
  fetch(SHEET_CSV,{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){
    var rows=t.trim().split(/\r?\n/).map(function(l){return l.split(',').map(function(c){return c.replace(/^"|"$/g,'').trim();});});
    var head=rows.shift().map(function(h){return h.toLowerCase();});
    var today=new Date();today.setHours(0,0,0,0);
    var list=rows.map(function(r){var o={};head.forEach(function(h,i){o[h]=r[i]||'';});var p=(o.datum||'').split('.');o._d=new Date(+p[2],+p[1]-1,+p[0]);return o;})
      .filter(function(o){return !isNaN(o._d)&&o._d>=today;}).sort(function(a,b){return a._d-b._d;});
    if(!list.length)return;
    var n=list[0];
    document.querySelectorAll('#next [data-f]').forEach(function(el){var k=el.getAttribute('data-f');if(n[k])el.textContent=n[k];});
  }).catch(function(){});
})();
</script>
