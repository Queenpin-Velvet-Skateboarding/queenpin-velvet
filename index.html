<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queenpin Velvet Skateboarding</title>
<meta name="description" content="Queenpin Velvet Skateboarding – Skate-Sessions, Kurse und Events für Frauen und Mädchen in Zürich.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;family=Courier+Prime:wght@400;700&amp;family=Fragment+Mono&amp;family=IBM+Plex+Mono:wght@100;200;700&amp;display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/queenpin-logo-schwarz.svg">
<link rel="stylesheet" href="https://use.typekit.net/qkn7udf.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="home">
<video class="hero-video" src="assets/tropfen.mp4" poster="" muted playsinline autoplay preload="auto" aria-hidden="true"></video>
<video class="hero-video hero-weiter" src="assets/zu-sessions.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
<h1 class="hero-title"><a href="sessions.html"><b>queenpin velvet</b><br><span>skateboarding</span></a></h1>
<nav aria-label="Hauptmenü">
<a class="corner tl" href="sessions.html">sessions</a>
<a class="corner tc" href="kurse.html">kurse</a>
<a class="corner tr" href="bald.html">queenpin</a>
<a class="corner bl" href="bald.html">Events</a>
<a class="corner br" href="bald.html">Gönnerin werden</a>
<span class="lang"><a href="index.html" aria-current="true">DE</a><a href="#">FR</a><a href="#">EN</a></span>
<a class="k-motto" href="bloom.html">It takes courage to bloom</a>
</nav>
</main>
<script>
(function(){
  var v=document.querySelector('.hero-video'),t=document.querySelector('.hero-title');
  function done(){t.classList.add('show');}
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){v.removeAttribute('autoplay');v.poster='assets/tropfen-ende.jpg';done();return;}
  v.addEventListener('ended',done);
  v.addEventListener('error',function(){v.poster='assets/tropfen-ende.jpg';done();});
  setTimeout(done,6500);
})();
</script>
<script>
/* Übergang zu den Sessions: Fleck zieht sich zusammen und zerstäubt, dann öffnet die Seite */
(function(){
  var w=document.querySelector('.hero-weiter');if(!w)return;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  document.querySelectorAll('a[href="sessions.html"]').forEach(function(a){
    a.addEventListener('click',function(e){
      if(e.metaKey||e.ctrlKey||e.shiftKey||w.classList.contains('an'))return;
      e.preventDefault();var ziel=a.href,weg=false;
      function los(){if(!weg){weg=true;document.body.classList.add('weg');setTimeout(function(){location.href=ziel;},350);}}
      document.body.classList.add('uebergang');
      w.classList.add('an');w.currentTime=0;w.playbackRate=1.5;
      w.play().then(function(){w.playbackRate=1.5;}).catch(los);
      w.addEventListener('ended',los);setTimeout(los,7000);
    });
  });
})();
</script>
</body>
</html>
