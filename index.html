<script>
(function(){
  var v=document.querySelector('.hero-video'),t=document.querySelector('.hero-title');
  function done(){t.classList.add('show');}
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){v.removeAttribute('autoplay');v.poster='assets/tropfen-ende.jpg';done();return;}
  v.addEventListener('ended',done);
  v.addEventListener('error',function(){v.poster='assets/tropfen-ende.jpg';done();});
  setTimeout(done,6500);
})();
</script>
