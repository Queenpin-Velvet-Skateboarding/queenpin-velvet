<script>
/* Seite höher als Fenster oder Text unter dem Menü? Dann Menü fix auf Papierstreifen und Seite scrollt */
(function(){var h=document.documentElement;

var m=document.querySelector('nav .k-motto'),grenze=(m?m.getBoundingClientRect().top:innerHeight-90)-10,unten=0;

c();addEventListener('resize',c);addEventListener('load',c);addEventListener('hashchange',function(){setTimeout(c,50)});addEventListener('popstate',function(){setTimeout(c,50)});
